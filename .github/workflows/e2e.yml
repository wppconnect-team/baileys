name: E2E Tests

on:
  push:
    branches:
      - master
      - develop

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js and Corepack
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Enable Corepack and Set Yarn Version
        run: |
          corepack enable
          corepack prepare yarn@4.x --activate

      - name: Restore Yarn Cache
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Start bartender mock server
        id: bartender
        env:
          BARTENDER_IMAGE: ghcr.io/whiskeysockets-devtools/bartender:latest
          BARTENDER_GHCR_TOKEN: ${{ secrets.BARTENDER_GHCR_TOKEN }}
          BARTENDER_GHCR_USERNAME: ${{ secrets.BARTENDER_GHCR_USERNAME || github.actor }}
        run: |
          set -euo pipefail

          if [ -z "$BARTENDER_GHCR_TOKEN" ]; then
            echo "::warning::BARTENDER_GHCR_TOKEN is not configured; skipping E2E tests that require the private bartender image."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! printf '%s' "$BARTENDER_GHCR_TOKEN" | docker login ghcr.io -u "$BARTENDER_GHCR_USERNAME" --password-stdin; then
            echo "::warning::Could not authenticate to GHCR for bartender; skipping E2E tests."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! docker pull "$BARTENDER_IMAGE"; then
            echo "::warning::Could not pull $BARTENDER_IMAGE; skipping E2E tests."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docker run \
            --detach \
            --name bartender \
            --publish 8080:8080 \
            --env CHATSTATE_TTL_SECS=3 \
            --env ADV_SECRET_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            --log-driver none \
            "$BARTENDER_IMAGE"

          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Wait for mock server
        if: steps.bartender.outputs.available == 'true'
        run: |
          for i in $(seq 1 30); do
            if curl -sk https://localhost:8080/ > /dev/null 2>&1; then
              echo "Mock server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Mock server failed to become ready"
          exit 1

      - name: Run E2E tests
        if: steps.bartender.outputs.available == 'true'
        env:
          SOCKET_URL: 'wss://127.0.0.1:8080/ws/chat'
          ADV_SECRET_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
        run: yarn test:e2e

      - name: Stop bartender mock server
        if: always() && steps.bartender.outputs.available == 'true'
        run: docker rm -f bartender
