name: Publish @wppconnect/baileys

# Publishes this fork to npm as @wppconnect/baileys from the publish branch.
#
# WHY A `publish` BRANCH:
# The default branch (master) stays a faithful mirror of upstream so rebasing/
# syncing with WhiskeySockets/Baileys is conflict-free. This `publish` branch is
# the ONLY place package.json carries the scoped name + the fork's repository
# url — which OIDC provenance REQUIRES to match the GitHub repo. Keep `publish`
# rebased on master and re-apply only those package.json fields when syncing.
#
# Auth: GitHub Actions secret NPM_TOKEN.

on:
  push:
    branches:
      - publish
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (publish branch)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Enable Corepack (yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Build
        run: yarn build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          TAG=$(node -p "const v = require('./package.json').version; const m = v.match(/-([a-zA-Z]+)/); m ? m[1] : 'latest'")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already published, skipping."
          else
            npm publish --access public --tag "$TAG"
          fi
