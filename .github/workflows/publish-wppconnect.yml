name: Publish @wppconnect/baileys

# Publishes this fork to npm as @wppconnect/baileys via OIDC trusted publishing.
#
# WHY A `publish` BRANCH:
# The default branch (master) stays a faithful mirror of upstream so rebasing/
# syncing with WhiskeySockets/Baileys is conflict-free. This `publish` branch is
# the ONLY place package.json carries the scoped name + the fork's repository
# url — which OIDC provenance REQUIRES to match the GitHub repo. Keep `publish`
# rebased on master and re-apply only those package.json fields when syncing.
#
# FIRST PUBLISH IS MANUAL (see PUBLISHING.md): a brand-new package must be
# created on npm and have its Trusted Publisher configured before OIDC works.
# After that, pushing to `publish` (or running this workflow) publishes.
#
# Auth: OIDC trusted publishing — configure the trusted publisher on npm for
# @wppconnect/baileys pointing at THIS repo + workflow + the `publish` branch.
# No NPM_TOKEN secret needed. npm auto-generates provenance.

on:
  push:
    branches:
      - publish
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (publish branch)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm (>= 11.5.1 required for trusted publishing)
        run: npm install -g npm@latest

      - name: Enable Corepack (yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Build
        run: yarn build

      - name: Publish to npm (OIDC)
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already published, skipping."
          else
            npm publish
          fi
